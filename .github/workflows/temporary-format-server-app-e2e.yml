name: Temporary Server App E2E formatter
on:
  push:
    branches:
      - feature/garh-jaisal-deployment-room-number-six-digit-pins
    paths:
      - frontend/e2e/server-app-ordering.spec.ts
      - .github/workflows/temporary-format-server-app-e2e.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Format the Server App E2E file
        working-directory: frontend
        run: npx oxfmt --write -- e2e/server-app-ordering.spec.ts
      - name: Commit formatted file when changed
        run: |
          if git diff --quiet -- frontend/e2e/server-app-ordering.spec.ts; then
            echo "The file is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/server-app-ordering.spec.ts
          git commit -m "style: format Server App E2E test"
          git push origin "HEAD:${GITHUB_REF_NAME}"
