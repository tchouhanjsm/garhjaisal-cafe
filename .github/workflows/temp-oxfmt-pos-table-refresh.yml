name: Temporary POS table refresh formatter

on:
  push:
    branches:
      - feature/m2-postpaid-table-refresh-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Format the changed Playwright spec with the pinned Oxfmt version
        working-directory: frontend
        run: npx oxfmt --write -- e2e/pos-table-state-refresh.spec.ts

      - name: Commit formatter output when needed
        run: |
          if git diff --quiet -- frontend/e2e/pos-table-state-refresh.spec.ts; then
            echo "The test file is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/pos-table-state-refresh.spec.ts
          git commit -m "style: format POS table refresh browser tests"
          git push origin "$GITHUB_REF_NAME"
