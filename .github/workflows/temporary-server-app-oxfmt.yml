name: Temporary Server App formatter helper

on:
  push:
    branches:
      - feature/garh-jaisal-deployment-room-number-six-digit-pins
    paths:
      - .github/workflows/temporary-server-app-oxfmt.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install formatter dependencies
        run: npm ci --ignore-scripts
      - name: Format the changed Server App page
        working-directory: frontend
        run: npx oxfmt --write -- src/app/server-standalone/page.tsx
      - name: Print exact diff
        run: git diff -- frontend/src/app/server-standalone/page.tsx