name: Temporary PR formatter helper

on:
  push:
    branches:
      - feature/garh-jaisal-deployment-room-number-six-digit-pins
    paths:
      - .github/workflows/temporary-oxfmt-helper.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install formatter dependencies
        run: npm ci --ignore-scripts
      - name: Run repository formatter on the remaining files
        run: npx oxfmt --write -- main/routes/auth.ts tests/e2e-argentina-flow.test.ts tests/pin-quick-switch.test.ts
      - name: Publish exact formatter diff to the job log
        run: git diff -- main/routes/auth.ts tests/e2e-argentina-flow.test.ts tests/pin-quick-switch.test.ts