name: Temporary root test formatter helper

on:
  push:
    branches:
      - feature/garh-jaisal-deployment-room-number-six-digit-pins
    paths:
      - .github/workflows/temporary-root-oxfmt.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install formatter dependencies
        run: npm ci --ignore-scripts
      - name: Format changed root test files
        run: >
          npx oxfmt --write --
          tests/first-run-setup.test.ts
          tests/issue-265-morocco-profile.test.ts
          tests/setup-failure-recovery.test.ts
      - name: Print formatter diff
        run: git diff -- tests/first-run-setup.test.ts tests/issue-265-morocco-profile.test.ts tests/setup-failure-recovery.test.ts