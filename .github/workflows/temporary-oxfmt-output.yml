name: Temporary Oxfmt output
on:
  push:
    branches:
      - feature/menu-studio-core
permissions:
  contents: read
jobs:
  formatter-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install repository dependencies
        run: npm ci
      - name: Format and emit exact source
        run: |
          npx oxfmt --write main/routes/menu-studio.ts tests/menu-studio-api.test.ts
          echo "===ROUTE_B64_BEGIN==="
          base64 -w0 main/routes/menu-studio.ts
          echo
          echo "===ROUTE_B64_END==="
          echo "===TEST_B64_BEGIN==="
          base64 -w0 tests/menu-studio-api.test.ts
          echo
          echo "===TEST_B64_END==="
