name: Temporary frontend formatter helper

on:
  push:
    branches:
      - feature/garh-jaisal-deployment-room-number-six-digit-pins
    paths:
      - .github/workflows/temporary-frontend-oxfmt.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install formatter dependencies
        run: npm ci --ignore-scripts
      - name: Format changed frontend files
        working-directory: frontend
        run: >
          npx oxfmt --write --
          "src/app/(dashboard)/pos/page.tsx"
          "src/app/server-standalone/page.tsx"
          "src/components/settings/MasterPinPrompt.tsx"
          "src/store/auth.ts"
      - name: Print formatter diff
        run: git diff -- frontend/src/app/\(dashboard\)/pos/page.tsx frontend/src/app/server-standalone/page.tsx frontend/src/components/settings/MasterPinPrompt.tsx frontend/src/store/auth.ts