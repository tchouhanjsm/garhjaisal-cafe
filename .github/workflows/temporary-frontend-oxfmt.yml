name: Temporary frontend Oxfmt output
on:
  push:
    branches:
      - feature/menu-studio-core
permissions:
  contents: read
jobs:
  formatter-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Format and emit exact frontend source
        run: |
          cd frontend
          npx oxfmt --write "src/app/(dashboard)/menu-studio/page.tsx"
          echo "===MENU_STUDIO_PAGE_B64_BEGIN==="
          base64 -w0 "src/app/(dashboard)/menu-studio/page.tsx"
          echo
          echo "===MENU_STUDIO_PAGE_B64_END==="
