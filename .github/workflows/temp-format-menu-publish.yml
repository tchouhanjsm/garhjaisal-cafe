name: Temporary menu publishing formatter

on:
  push:
    branches:
      - client/menu-publish-mac-to-windows-20261115

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'chore: run repository formatter on menu publishing files'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: client/menu-publish-mac-to-windows-20261115

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install formatter dependencies
        run: npm ci --ignore-scripts

      - name: Format menu publishing files
        run: npx --no-install oxfmt --write -- main/routes/menu-publishing.ts main/services/menu-publishing.ts tests/menu-publishing.test.ts

      - name: Commit repository-formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/routes/menu-publishing.ts main/services/menu-publishing.ts tests/menu-publishing.test.ts
          git commit -m "style: format menu publishing sources"
          git push origin HEAD:refs/heads/client/menu-publish-mac-to-windows-20261115
