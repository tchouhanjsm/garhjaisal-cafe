name: Temporary menu publishing formatter

on:
  push:
    branches:
      - client/menu-publish-mac-to-windows-20261115

permissions:
  contents: read

jobs:
  format:
    if: github.event.head_commit.message == 'style: trigger formatter commit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: client/menu-publish-mac-to-windows-20261115

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install formatter dependencies
        run: npm ci --ignore-scripts

      - name: Format menu publishing files
        run: npx --no-install oxfmt --write -- main/routes/menu-publishing.ts main/services/menu-publishing.ts tests/menu-publishing.test.ts

      - name: Package formatted files
        run: |
          mkdir -p formatted/routes formatted/services formatted/tests
          cp main/routes/menu-publishing.ts formatted/routes/
          cp main/services/menu-publishing.ts formatted/services/
          cp tests/menu-publishing.test.ts formatted/tests/

      - name: Upload formatted files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: menu-publishing-formatted-source
          path: formatted/
          if-no-files-found: error
          retention-days: 1
